<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1a20">
<title>Pfahlstadt – Ebbe & Flut</title>
<style>
  :root { --panel: rgba(6, 18, 24, 0.88); --card: rgba(22, 44, 52, 0.92); --btn: #1d6f78; --btn2: #26878f; --txt: #eef5f6; --dim: #a9c3c8; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1a20; color: var(--txt); font: 15px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #top { position: fixed; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top) + 6px) 8px 8px; background: var(--panel); backdrop-filter: blur(6px); }
  .res { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; max-width: 720px; margin: 0 auto; }
  .card { background: var(--card); border-radius: 10px; padding: 5px 8px; }
  .rn { font-size: 12px; font-weight: 700; letter-spacing: .02em; }
  .rv { font-size: 21px; font-weight: 800; }
  .rr { font-size: 12px; }
  .l1, .l2 { max-width: 720px; margin: 5px auto 0; font-size: 13px; color: var(--dim); }
  .l1 b, .l2 b { color: var(--txt); }
  #toasts { position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top) + 142px); width: min(94vw, 640px); pointer-events: none; display: flex; flex-direction: column; gap: 6px; }
  .toast { background: rgba(8, 40, 48, 0.93); border: 1px solid rgba(127, 211, 240, .25); border-radius: 10px; padding: 8px 12px; text-align: center; font-size: 14px; animation: tin .25s ease-out; }
  @keyframes tin { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  #map { position: fixed; inset: 0; z-index: 1; }
  #mapc { width: 100%; height: 100%; display: block; touch-action: none; }
  #top, #bottom { z-index: 3; } #toasts { z-index: 4; } #panel { z-index: 5; } #badge { z-index: 4; }
  .sub2 { font-weight: 800; margin: 10px 0 2px; }
  .btn.sm2 { min-width: 44px; padding: 10px 8px; font-size: 14px; }
  .rep.win { border-left: 4px solid #4fd18b; } .rep.loss { border-left: 4px solid #e0524a; }
  .form { display: flex; gap: 8px; margin-top: 8px; }
  .form input { flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 11px 12px; border-radius: 10px; border: 1px solid rgba(127,211,240,.35); background: rgba(0,0,0,.35); color: var(--txt); user-select: text; -webkit-user-select: text; }
  .form input.short { flex: 0 0 90px; }
  .chat { max-height: 34vh; overflow-y: auto; background: rgba(0,0,0,.25); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 5px; }
  .msg { font-size: 14px; background: rgba(255,255,255,.06); padding: 6px 9px; border-radius: 9px; align-self: flex-start; max-width: 90%; }
  .msg.me { align-self: flex-end; background: rgba(38,135,143,.45); }
  .msg.sys { align-self: center; background: none; color: var(--dim); font-size: 12px; }
  .msg b { color: #7fd3f0; margin-right: 4px; }
  .code { font-family: monospace; font-size: 14px; word-break: break-all; background: rgba(0,0,0,.4); padding: 10px; border-radius: 8px; user-select: text; -webkit-user-select: text; }
  .meRow { outline: 2px solid #7fd3f0; }
  .bb b { font-size: 13px; } .bb span { font-size: 11px; }
  #login { position: fixed; inset: 0; z-index: 20; background: linear-gradient(#0b1a20, #0d3346); display: none; flex-direction: column; align-items: center; justify-content: center; padding: 28px; gap: 12px; text-align: center; }
  #login .box { width: min(92vw, 420px); background: var(--panel); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  #login input { font: inherit; font-size: 17px; padding: 13px; border-radius: 10px; border: 1px solid rgba(127,211,240,.35); background: rgba(0,0,0,.35); color: var(--txt); user-select: text; -webkit-user-select: text; }
  #login .link { background: none; color: #7fd3f0; text-decoration: underline; padding: 6px; font-size: 14px; }
  #loginErr { color: #ff8a8a; min-height: 18px; font-size: 14px; }
  #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .lbl { position: absolute; left: 0; top: 0; background: rgba(0, 12, 16, .62); padding: 3px 9px; border-radius: 8px; font-size: 13px; font-weight: 700; white-space: nowrap; text-align: center; }
  .lbl i { font-style: normal; color: #7fd3f0; margin-left: 3px; }
  .lbl small { display: block; font-weight: 400; font-size: 11px; color: var(--dim); }
  .bar { height: 6px; background: rgba(0, 0, 0, .5); border-radius: 3px; margin-top: 3px; overflow: hidden; min-width: 110px; }
  .bar > div { height: 100%; background: #66d9ff; }
  .bar.big { height: 14px; border-radius: 7px; margin: 6px 0 10px; }
  #bottom { position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 8px calc(env(safe-area-inset-bottom) + 8px); background: var(--panel); backdrop-filter: blur(6px); }
  #bottom .row4 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; max-width: 720px; margin: 0 auto; }
  button { font: inherit; color: var(--txt); border: 0; cursor: pointer; }
  .bb { background: var(--btn); border-radius: 12px; min-height: 60px; padding: 6px 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .bb b { font-size: 14px; } .bb span { font-size: 12px; color: #cfe6ea; } .bb i { font-style: normal; font-weight: 800; }
  .bb:active, .btn:active { filter: brightness(1.2); }
  button:disabled { opacity: .45; }
  #panel { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 88px); width: min(96vw, 700px); max-height: 62vh; overflow-y: auto; background: var(--panel); border-radius: 16px; padding: 12px 14px 14px; box-shadow: 0 10px 40px rgba(0, 0, 0, .45); backdrop-filter: blur(8px); }
  .ph { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .pt { font-size: 20px; font-weight: 800; }
  .x { background: rgba(255, 255, 255, .08); width: 40px; height: 40px; border-radius: 10px; font-size: 18px; }
  .row { display: flex; gap: 10px; align-items: center; background: var(--card); border-radius: 12px; padding: 8px 10px; margin-top: 7px; }
  .ri { flex: 1; min-width: 0; }
  .sh { font-size: 12px; color: #9fd8e0; }
  .sm { font-size: 13px; color: var(--dim); margin-top: 3px; }
  .warn { font-size: 12px; color: #ff8a8a; margin-top: 2px; }
  .desc { font-size: 14px; color: var(--dim); margin-bottom: 8px; }
  .inf { font-size: 15px; margin: 4px 0; }
  .btn { background: var(--btn); border-radius: 10px; padding: 12px 16px; min-width: 96px; font-size: 15px; }
  .btn.ghost { background: rgba(255, 255, 255, .1); }
  .btn.danger { background: #8a2a22; }
  .btns { display: flex; gap: 10px; margin-top: 12px; justify-content: space-between; flex-wrap: wrap; }
  .btns.col { flex-direction: column; } .btns.col .btn { width: 100%; }
  #loading, #err { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0b1a20; gap: 10px; text-align: center; padding: 30px; }
  #err { display: none; z-index: 10; }
  #badge { position: fixed; right: 8px; top: calc(env(safe-area-inset-top) + 124px); background: #c2410c; color: #fff; font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 6px; pointer-events: none; letter-spacing: .04em; }
  .logo { font-size: 30px; font-weight: 900; letter-spacing: .02em; }
  .sub { color: var(--dim); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<div id="map" style="display:none"><canvas id="mapc"></canvas></div>
<div id="top"><div class="res"></div><div class="l1"></div><div class="l2"></div></div>
<div id="toasts"></div>
<div id="badge" style="display:none"></div>
<div id="panel" style="display:none"></div>
<div id="bottom"><div class="row4">
  <button class="bb" id="bBeacon"></button>
  <button class="bb" id="bExp"></button>
  <button class="bb" id="bMap"></button>
  <button class="bb" id="bAlly"></button>
  <button class="bb" id="bMenu"><b>Menü</b></button>
</div></div>
<div id="login">
  <div class="logo">Pfahlstadt</div><div class="sub">Ebbe &amp; Flut – Mehrspieler</div>
  <div class="box">
    <div id="loginNameBox" style="display:flex;flex-direction:column;gap:10px">
      <div>Wähle deinen Spielernamen. Damit sehen dich deine Freunde auf der Seekarte.</div>
      <input id="loginName" maxlength="16" placeholder="Spielername (3–16 Zeichen)" autocomplete="off">
      <button class="btn" data-a="register"><b>Los geht's</b></button>
      <button class="link" data-a="loginCode">Ich habe schon ein Konto (Umzugscode)</button>
    </div>
    <div id="loginCodeBox" style="display:none;flex-direction:column;gap:10px">
      <div>Gib den Umzugscode aus deinem alten Handy ein (Menü → Online-Konto).</div>
      <input id="loginCode" placeholder="Umzugscode" autocomplete="off">
      <button class="btn" data-a="restore"><b>Konto übernehmen</b></button>
      <button class="link" data-a="loginName">Zurück</button>
    </div>
    <div id="loginErr"></div>
    <button class="link" data-a="offline">Erst mal offline spielen</button>
  </div>
</div>
<div id="loading"><div class="logo">Pfahlstadt</div><div class="sub">Ebbe &amp; Flut</div></div>
<div id="err"><div class="logo">Pfahlstadt</div><p></p></div>
<script src="version.js"></script>
<script src="game.js"></script>
</body>
</html>
