plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'de.robertbaasner.pfahlstadt'
    compileSdk 34

    defaultConfig {
        applicationId "de.robertbaasner.pfahlstadt"
        minSdk 26
        targetSdk 34
        versionCode runNumber
        versionName "1.0.${runNumber}"
    }

    signingConfigs {
        release {
            storeFile file("pfahlstadt.jks")
            storePassword "pfahlstadt"
            keyAlias "pfahlstadt"
            keyPassword "pfahlstadt"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
