plugins {
    id 'com.android.application'
}

// Kanal "test" (nur für dich) oder "public" (für Freunde) – getrennte Apps, getrennte Spielstände
def channel = (project.findProperty("channel") ?: "test").toString()
def vName = (project.findProperty("vName") ?: "dev").toString()
def vCode = (project.findProperty("vCode") ?: "1").toString().toInteger()
def isPublic = channel == "public"

android {
    namespace 'de.robertbaasner.pfahlstadt'
    compileSdk 34

    defaultConfig {
        applicationId isPublic ? "de.robertbaasner.pfahlstadt" : "de.robertbaasner.pfahlstadt.test"
        minSdk 26
        targetSdk 34
        versionCode vCode
        versionName vName
        resValue "string", "app_name", isPublic ? "Pfahlstadt" : "Pfahlstadt Test"
        // Hier sucht die App beim Start nach neuen Spieldateien
        resValue "string", "update_base", (isPublic ? "https://github.com/robertpahl1987-creator/pfahlstadt/releases/latest/download/" : "https://github.com/robertpahl1987-creator/pfahlstadt/releases/download/test/")
    }

    signingConfigs {
        release {
            storeFile file("pfahlstadt.jks")
            storePassword "pfahlstadt"
            keyAlias "pfahlstadt"
            keyPassword "pfahlstadt"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
