name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Spiel bündeln
        run: |
          npx --yes esbuild@0.24.0 web/src/main.js --bundle --format=iife --target=es2020 --minify --outfile=web/game.js
          mkdir -p android/app/src/main/assets
          cp web/index.html web/game.js android/app/src/main/assets/

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: APK bauen
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/release/app-release.apk Pfahlstadt-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Pfahlstadt-APK
          path: Pfahlstadt-*.apk

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Pfahlstadt 1.0.${{ github.run_number }}
          body: Pfahlstadt – Ebbe & Flut. APK herunterladen und auf dem Handy installieren.
          files: Pfahlstadt-*.apk
          make_latest: true
