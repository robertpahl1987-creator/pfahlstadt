name: Version für Freunde veröffentlichen

# Nur von Hand starten: Actions → "Version für Freunde veröffentlichen" → Run workflow.
# Enthält immer ALLE Änderungen bis jetzt. Versionsnummer kommt aus release/version.txt (1.0, 1.1, 1.2 …).
on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Was ist neu? (wird Freunden angezeigt)"
        required: false
        default: "Neue Version von Pfahlstadt."
      dry_run:
        description: "Nur testen, nichts veröffentlichen"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Versionsnummer lesen
        id: v
        run: |
          V=$(tr -d '[:space:]' < release/version.txt)
          MAJOR=${V%%.*}; MINOR=${V#*.}
          echo "name=$V" >> $GITHUB_OUTPUT
          echo "code=$((MAJOR * 1000 + MINOR))" >> $GITHUB_OUTPUT
          echo "next=$MAJOR.$((MINOR + 1))" >> $GITHUB_OUTPUT
          echo "Version $V"

      - name: Spiel bündeln
        run: |
          npx --yes esbuild@0.24.0 web/src/main.js --bundle --format=iife --target=es2020 --minify --outfile=web/game.js
          mkdir -p android/app/src/main/assets
          cp web/index.html web/game.js android/app/src/main/assets/
          echo '{"build": ${{ steps.v.outputs.code }}, "min_shell": 1}' > android/app/src/main/assets/web-version.json
          echo "window.APP_VERSION = { name: '${{ steps.v.outputs.name }}', channel: 'public' };" > android/app/src/main/assets/version.js

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: APK bauen
        working-directory: android
        run: gradle assembleRelease --no-daemon -Pchannel=public -PvName=${{ steps.v.outputs.name }} -PvCode=${{ steps.v.outputs.code }}

      - run: cp android/app/build/outputs/apk/release/app-release.apk Pfahlstadt-${{ steps.v.outputs.name }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Pfahlstadt-${{ steps.v.outputs.name }}
          path: "Pfahlstadt-*.apk"

      - name: Veröffentlichen
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.name }}
          name: Pfahlstadt ${{ steps.v.outputs.name }}
          body: ${{ inputs.notes }}
          make_latest: true
          files: |
            Pfahlstadt-${{ steps.v.outputs.name }}.apk
            android/app/src/main/assets/index.html
            android/app/src/main/assets/game.js
            android/app/src/main/assets/version.js
            android/app/src/main/assets/web-version.json

      - name: Nächste Versionsnummer vormerken
        if: ${{ !inputs.dry_run }}
        run: |
          echo "${{ steps.v.outputs.next }}" > release/version.txt
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add release/version.txt
          git commit -m "Nächste Freunde-Version: ${{ steps.v.outputs.next }} [skip ci]"
          git push
