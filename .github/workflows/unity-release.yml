name: Unity-Version veröffentlichen

# Holt alle 10 Minuten den neuesten erfolgreichen Build aus Unity Build Automation
# und legt ihn als Vorab-Release "unity-N" ab. Die Unity-App findet ihn dort und aktualisiert sich selbst.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unity-release
  cancel-in-progress: false

env:
  # Aus der Adresse von cloud.unity.com (organizations/<ORG>/projects/<PROJEKT>)
  UNITY_ORG: '9072494446539'
  UNITY_PROJECT: 'e5ced9f3-f832-4e54-b13b-3e0adad4e7d8'
  APP_NAME: 'Pfahlstadt'
  API: https://build-automation.services.api.unity.com/v2

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Neuesten Unity-Build holen und veröffentlichen
        env:
          AUTH: ${{ secrets.UNITY_AUTH }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -u
          if [ -z "$AUTH" ] || [ -z "$UNITY_ORG" ] || [ "$UNITY_ORG" = "x" ]; then
            echo "Noch nicht eingerichtet (Secret UNITY_AUTH oder Org/Projekt fehlt)."; exit 0
          fi
          # Erlaubt: "Basic xyz", "Authorization: Basic xyz" oder nur "xyz"
          A=$(printf '%s' "$AUTH" | tr -d '\r\n' | sed -E 's/^[[:space:]]*[Aa]uthorization:[[:space:]]*//; s/^[[:space:]]+//; s/[[:space:]]+$//')
          case "$A" in Basic\ *) H="$A" ;; *) H="Basic $A" ;; esac
          if [ -z "$UNITY_PROJECT" ] || [ "$UNITY_PROJECT" = "__PROJECT__" ]; then
            # Projekt-ID anhand des Namens suchen
            curl -sS -H "Authorization: $H" "$API/orgs/$UNITY_ORG/projects" -o projects.json
            UNITY_PROJECT=$(jq -r --arg n "$APP_NAME" 'if type=="array" then ([.[] | select((.name // "") | ascii_downcase == ($n | ascii_downcase))][0] // .[0]) | (.guid // .projectid // .id // empty) else empty end' projects.json)
            if [ -z "$UNITY_PROJECT" ]; then echo "Projekt nicht gefunden. Antwort:"; head -c 1500 projects.json; echo; exit 1; fi
            echo "Projekt: $UNITY_PROJECT"
          fi
          base="$API/orgs/$UNITY_ORG/projects/$UNITY_PROJECT"

          curl -sS -H "Authorization: $H" "$base/buildtargets" -o targets.json
          target=$(jq -r 'if type=="array" then ([.[] | select((.platform // "") | test("android";"i"))][0].buildtargetid // .[0].buildtargetid // empty) else empty end' targets.json)
          if [ -z "$target" ]; then echo "Kein Build-Ziel gefunden. Antwort:"; head -c 1500 targets.json; echo; exit 1; fi
          echo "Build-Ziel: $target"

          curl -sS -H "Authorization: $H" "$base/buildtargets/$target/builds?buildStatus=success&per_page=1" -o builds.json
          num=$(jq -r 'if type=="array" then (.[0].build // empty) else empty end' builds.json)
          if [ -z "$num" ]; then echo "Noch kein erfolgreicher Build. Antwort:"; head -c 1500 builds.json; echo; exit 0; fi
          url=$(jq -r '.[0].links.download_primary.href // ([.[0] | .. | .href? // empty | select(test("\\.apk"))][0]) // empty' builds.json)
          echo "Neuester Build: $num"

          tag="unity-$num"
          if gh release view "$tag" >/dev/null 2>&1; then
            size=$(gh release view "$tag" --json assets --jq '[.assets[].size] | max // 0')
            if [ "${size:-0}" -gt 1000000 ]; then echo "$tag ist schon veröffentlicht."; exit 0; fi
            echo "$tag ist kaputt (${size} Bytes) – wird neu angelegt."
            gh release delete "$tag" --yes --cleanup-tag
          fi
          if [ -z "$url" ]; then echo "Kein Download-Link gefunden. Antwort:"; head -c 2500 builds.json; echo; exit 1; fi

          f="$APP_NAME-Unity-$num.apk"
          # Link der Unity-API braucht die Anmeldung; die Weiterleitung zum Speicher geht ohne
          curl -sSL -H "Authorization: $H" "$url" -o "$f"
          size=$(stat -c %s "$f")
          if [ "$size" -lt 1000000 ]; then
            echo "Antwort ist ein Verweis ($size Bytes), hole die eigentliche Datei."
            # zweiter Versuch: Link zeigt auf JSON mit der eigentlichen Adresse
            real=$(jq -r 'if type=="string" then . else ([.. | .href? // .url? // empty | strings | select(test("^https?://"))][0] // empty) end' "$f" 2>/dev/null | head -1)
            if [ -n "$real" ]; then curl -sSL "$real" -o "$f"; size=$(stat -c %s "$f"); fi
          fi
          ls -l "$f"
          if [ "$size" -lt 1000000 ]; then echo "Download fehlgeschlagen ($size Bytes)."; exit 1; fi
          gh release create "$tag" "$f" --prerelease --latest=false \
            --title "$APP_NAME Unity – Build $num" \
            --notes "Unity-Fassung, Build $num aus Unity Build Automation. Die Unity-App aktualisiert sich damit von selbst."
