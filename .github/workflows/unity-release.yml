name: Unity-Version veröffentlichen

# Holt alle 10 Minuten den neuesten erfolgreichen Build aus Unity Build Automation
# und legt ihn als Vorab-Release "unity-N" ab. Die Unity-App findet ihn dort und aktualisiert sich selbst.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unity-release
  cancel-in-progress: false

env:
  # Aus der Adresse von cloud.unity.com (organizations/<ORG>/projects/<PROJEKT>)
  UNITY_ORG: '__ORG__'
  UNITY_PROJECT: '__PROJECT__'
  APP_NAME: 'Pfahlstadt'
  API: https://build-automation.services.api.unity.com/v2

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Neuesten Unity-Build holen und veröffentlichen
        env:
          AUTH: ${{ secrets.UNITY_AUTH }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -u
          if [ -z "$AUTH" ] || [ -z "$UNITY_ORG" ] || [ "$UNITY_ORG" = "__ORG__" ]; then
            echo "Noch nicht eingerichtet (Secret UNITY_AUTH oder Org/Projekt fehlt)."; exit 0
          fi
          # Erlaubt: "Basic xyz", "Authorization: Basic xyz" oder nur "xyz"
          A=$(printf '%s' "$AUTH" | tr -d '\r\n' | sed -E 's/^[[:space:]]*[Aa]uthorization:[[:space:]]*//; s/^[[:space:]]+//; s/[[:space:]]+$//')
          case "$A" in Basic\ *) H="$A" ;; *) H="Basic $A" ;; esac
          base="$API/orgs/$UNITY_ORG/projects/$UNITY_PROJECT"

          curl -sS -H "Authorization: $H" "$base/buildtargets" -o targets.json
          target=$(jq -r 'if type=="array" then ([.[] | select((.platform // "") | test("android";"i"))][0].buildtargetid // .[0].buildtargetid // empty) else empty end' targets.json)
          if [ -z "$target" ]; then echo "Kein Build-Ziel gefunden. Antwort:"; head -c 1500 targets.json; echo; exit 1; fi
          echo "Build-Ziel: $target"

          curl -sS -H "Authorization: $H" "$base/buildtargets/$target/builds?buildStatus=success&per_page=1" -o builds.json
          num=$(jq -r 'if type=="array" then (.[0].build // empty) else empty end' builds.json)
          if [ -z "$num" ]; then echo "Noch kein erfolgreicher Build. Antwort:"; head -c 1500 builds.json; echo; exit 0; fi
          url=$(jq -r '.[0].links.download_primary.href // ([.[0] | .. | .href? // empty | select(test("\\.apk"))][0]) // empty' builds.json)
          echo "Neuester Build: $num"

          tag="unity-$num"
          if gh release view "$tag" >/dev/null 2>&1; then echo "$tag ist schon veröffentlicht."; exit 0; fi
          if [ -z "$url" ]; then echo "Kein Download-Link gefunden. Antwort:"; head -c 2500 builds.json; echo; exit 1; fi

          curl -sSL "$url" -o "$APP_NAME-Unity-$num.apk"
          ls -l "$APP_NAME-Unity-$num.apk"
          gh release create "$tag" "$APP_NAME-Unity-$num.apk" --prerelease --latest=false \
            --title "$APP_NAME Unity – Build $num" \
            --notes "Unity-Fassung, Build $num aus Unity Build Automation. Die Unity-App aktualisiert sich damit von selbst."
